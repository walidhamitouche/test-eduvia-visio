# Alembic en ligne de commande : `uv run alembic -c alembic.ini revision --autogenerate -m "..."`.
# L'URL de la base est passée par `visio.db.migrate` (variable DATABASE_URL déchiffrée par
# dotenvx), jamais écrite ici.
[alembic]
script_location = src/visio/db/migrations
sqlalchemy.url = sqlite:///./data/visio.db
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
